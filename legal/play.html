<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Puzzle Den</title>
<meta name="description" content="A new puzzle every day in every game. Play today's daily in Puzzle Den." />
<!-- Link previews (iMessage, WhatsApp, Slack...) -->
<meta property="og:title" content="Puzzle Den — today's daily puzzles" />
<meta property="og:description" content="A new puzzle every day in every game. Can you beat my time?" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://dadilium.github.io/offlineMiniPuzzles/play.html" />
<!-- Generated by tools/assets/og_image.py. Must be an absolute URL for previews to load it. -->
<meta property="og:image" content="https://dadilium.github.io/offlineMiniPuzzles/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Puzzle Den — a 3×3 grid of puzzle tiles, two of them lit" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="theme-color" content="#0f131d" />
<!-- iOS Safari shows a native "Open / Get" banner for the app at the top. -->
<meta name="apple-itunes-app" content="app-id=6802090640" />
<style>
  :root {
    --bg: #0b0d12;
    --surface: #141822;
    --border: #262c3a;
    --text: #eef0f6;
    --text-dim: #9aa3b5;
    --accent: #3563e9;
    --tile: #2b3245;
    --lit: #4f78f5;
    --lit2: #3fdcf2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: radial-gradient(circle at 50% 30%, #18203a 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 380px;
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 32px 24px 28px;
    animation: rise 420ms cubic-bezier(.2,.8,.2,1) both;
  }
  .grid { display: grid; grid-template-columns: repeat(3, 22px); gap: 7px; justify-content: center; margin-bottom: 20px; }
  .grid span { width: 22px; height: 22px; border-radius: 6px; background: var(--tile); }
  .grid .lit { background: var(--lit); box-shadow: 0 0 18px #4f78f580; animation: pulse 2.4s ease-in-out infinite; }
  .grid .lit2 { background: var(--lit2); box-shadow: 0 0 18px #3fdcf280; animation: pulse 2.4s ease-in-out .6s infinite; }
  h1 { font-size: 1.45rem; margin: 0 0 6px; }
  p { color: var(--text-dim); font-size: .95rem; line-height: 1.5; margin: 0 0 22px; }
  .button {
    display: block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    padding: 14px 18px;
    border-radius: 14px;
  }
  .button:active { transform: scale(.98); }
  .note { margin: 16px 0 0; font-size: .85rem; }
  [hidden] { display: none !important; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 50% { transform: scale(.9); opacity: .85; } }
  @media (prefers-reduced-motion: reduce) { .card, .grid span { animation: none !important; } }
</style>
</head>
<body>
<main class="card">
  <div class="grid" aria-hidden="true">
    <span></span><span></span><span></span>
    <span></span><span class="lit"></span><span></span>
    <span></span><span></span><span class="lit2"></span>
  </div>
  <h1 data-i18n="title">Puzzle Den</h1>
  <p data-i18n="body">A new puzzle every day in every game. Can you beat today's time?</p>
  <a id="store" class="button" href="https://apps.apple.com/app/id6802090640" data-i18n="cta">Get it on the App Store</a>
  <p id="android" class="note" data-i18n="android" hidden>Coming soon to Android — for now Puzzle Den is on iPhone and iPad.</p>
  <p id="redirecting" class="note" data-i18n="redirecting" hidden>Opening the App Store…</p>
</main>
<script>
  // Shared daily results link here. One link for everyone: iPhone/iPad go
  // straight to the App Store (which shows "Open" if the app is installed),
  // Android gets a coming-soon note, desktop gets the button.
  (function () {
    var STORE_URL = 'https://apps.apple.com/app/id6802090640';
    var copy = {
      fr: {
        body: "Un nouveau puzzle chaque jour dans chaque jeu. Saurez-vous battre ce temps ?",
        cta: "Télécharger sur l'App Store",
        android: "Bientôt sur Android — pour l'instant Puzzle Den est disponible sur iPhone et iPad.",
        redirecting: "Ouverture de l'App Store…"
      }
    };
    var lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
    if (copy[lang]) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var text = copy[lang][el.getAttribute('data-i18n')];
        if (text) el.textContent = text;
      });
    }
    var ua = navigator.userAgent || '';
    // iPadOS reports itself as a Mac -- touch support tells them apart.
    var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    if (isIOS) {
      document.getElementById('redirecting').hidden = false;
      window.location.replace(STORE_URL);
    } else if (/Android/i.test(ua)) {
      document.getElementById('android').hidden = false;
    }
  })();
</script>
</body>
</html>
